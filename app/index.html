<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f17" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex,follow" />
    <meta name="application-name" content="Vexale" />
    <title>Vexale — Your workspace</title>
    <link rel="icon" type="image/svg+xml" href="/vexale-favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { min-height: 100%; background: #0a0f17; }
      #vexale-boot { display: none; }
      html[data-vexale-view="app"] #vexale-boot {
        position: fixed; z-index: 10; inset: 0; display: grid; place-content: center;
        gap: 12px; background: #0a0f17; color: #f3f6fb; text-align: center;
        font: 600 15px/1.4 system-ui, sans-serif;
      }
      #vexale-boot[hidden], #root[hidden] { display: none !important; }
      #vexale-boot img { width: 64px; height: 64px; margin: auto; border-radius: 16px; }
      #vexale-boot .vexale-boot-spinner { width: 20px; height: 20px; margin: 4px auto 0; border: 2px solid #f3f6fb33; border-top-color: #a78bfa; border-radius: 50%; animation: vexale-boot-spin .8s linear infinite; }
      @keyframes vexale-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #vexale-boot .vexale-boot-spinner { animation: none; } }
    </style>
    <script>document.documentElement.dataset.vexaleView = 'app';</script>
  </head>
  <body>
    <div id="vexale-boot" role="status" aria-live="polite"><img src="/vexale-favicon.png" width="64" height="64" alt="" /><span>Vexale</span><span class="vexale-boot-spinner" aria-hidden="true"></span></div>
    <div id="root" hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
